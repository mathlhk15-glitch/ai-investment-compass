<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c45"><title>뀨의 투자 나침반 | 개인 투자 기록·점검</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><span class="logo">✦</span><span><b>뀨의 투자 나침반</b><small>예측보다 근거, 수익보다 위험 확인</small></span></div><div class="topright"><span id="save-status" class="small">이 기기에 저장</span><button class="btn ghost" id="settings-btn">⚙ 설정·백업</button></div></header>
<nav class="nav" id="nav" aria-label="주 메뉴"><button data-tab="home" class="active">⌂ 점검 홈</button><button data-tab="ledger">▤ 내 투자 관리</button><button data-tab="research">⌕ 관심 종목</button><button data-tab="plan">✓ 투자 계획</button><button data-tab="macro">◷ 경제·위험</button><button data-tab="learn">? 쉬운 설명</button></nav>
<main class="wrap"><div id="notice" class="notice hidden" role="status" aria-live="polite"></div><section id="screen"></section></main>
<footer>개인용 투자 기록·교육 도구 · 자동 주문 없음 · 데이터 입력·기준일 확인 필수 · 투자 판단과 책임은 이용자 본인에게 있습니다.</footer>
<dialog id="onboarding"><form method="dialog" id="onboarding-form"><div class="modalhead"><span class="eyebrow">처음 시작하기</span><h2>처음 시작하기 · 투자 기록 도구</h2><p class="muted">초보자를 위한 개인 기록 도구입니다. 금융상품 추천이나 위험 성향의 정확한 진단이 아닙니다.</p></div><label>주 투자 기간<select id="ob-horizon"><option value="장기(1년 이상)">중장기 (1년 이상)</option><option value="단기">단기 (1년 미만)</option><option value="혼합">단기·중장기 혼합</option></select></label><label>주로 확인할 시장<select id="ob-market"><option>한국·미국</option><option>한국</option><option>미국</option></select></label><label>투자 목적<input id="ob-goal" placeholder="예: 5년 동안 투자 원칙을 지키기" maxlength="120"></label><label class="inline"><input id="ob-ack" type="checkbox" required> 투자 참고용이며, 수익과 원금이 보장되지 않는다는 점을 이해했습니다.</label><button class="btn primary wide" value="confirm">시작하기</button></form></dialog>
<dialog id="modal"><div id="modal-content"></div><button class="btn ghost wide" onclick="document.getElementById('modal').close()">닫기</button></dialog>
<script src="core.js"></script><script src="app.js"></script></body></html>
